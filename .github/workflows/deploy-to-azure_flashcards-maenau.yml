name: Build and deploy Node.js app to Azure Web App - FlashCards-maenau

on:
  push:
    branches:
      - deploy-to-azure
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "20.x" # Utilise la v20 LTS, plus stable pour Adonis 6

      - name: Install dependencies
        run: |
          cd app-flashcards
          npm ci

      - name: Build project
        run: |
          cd app-flashcards
          npm run build

      - name: Prepare Deployment Folder
        run: |
          cd app-flashcards
          cd build
          npm ci --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: app-flashcards/build/
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "Production"

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "FlashCards-maenau"
          slot-name: "Production"
          package: . # Ici '.' correspond maintenant au contenu de build/
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2B345DA0C4804ADDB209EBA11C12E673 }}
