name: Deploy AdonisJS (MySQL + Edge) to Azure

on:
  push:
    branches:
      - deploy-to-azure
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          cd app-flashcards
          npm install

      # 4. Build AdonisJS
      - name: Build Adonis
        run: |
          cd app-flashcards
          npm run build

      # 5. Prepare deploy folder
      - name: Prepare deploy folder
        run: |
          mkdir deploy
          cd app-flashcards
          cp -R build ../deploy/build
          cp package.json ../deploy/
          cp package-lock.json ../deploy/
          cp -R resources/views ../deploy/resources/views

      # 6. Deploy to Azure
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: FlashCards-maenau
          slot-name: Production
          package: deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CBFBDF400E01439496E91FE3263A5615 }}
